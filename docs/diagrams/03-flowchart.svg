<rect x="300" y="72" width="160" height="44" rx="22" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="380" y="99.25" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#14532d">เริ่มต้น</text><rect x="200" y="150" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="182.9" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#12325c">1. นำเข้าไฟล์ Bank Statement (หน้า Import)</text><rect x="200" y="232" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="255.475" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">2. สั่งซิงค์ข้อมูล GL</text><text x="380" y="273.975" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">ผ่าน TRW Data Center API</text><rect x="200" y="314" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="337.475" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">3. กด New reconciliation</text><text x="380" y="355.975" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">เลือกธนาคารและช่วงวันที่</text><rect x="200" y="396" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="428.9" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#12325c">4. ระบบโหลดรายการค้างจับคู่ทั้ง 2 ฝั่ง</text><polygon points="380,466 555,512 380,558 205,512" fill="#ffe4e6" stroke="#be123c" stroke-width="1.6"/><text x="380" y="507.975" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#881337">5. ใช้ปุ่ม Suggest matches</text><text x="380" y="525.475" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#881337">ให้ระบบหาคู่ให้หรือไม่?</text><rect x="200" y="610" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="633.475" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">6. ระบบจับกลุ่ม 1:1 / 1:N / N:1</text><text x="380" y="651.975" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">แล้วเปิดหน้า Preview</text><rect x="200" y="692" width="360" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="380" y="724.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="400" fill="#12325c">7. ผู้ใช้ตรวจ และติ๊กเอากลุ่มที่ไม่ต้องการออก</text><rect x="710" y="610" width="340" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="880" y="642.9" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="400" fill="#12325c">6'. ผู้ใช้ติ๊กเลือกรายการเองทั้ง 2 ฝั่ง</text><polygon points="600,782 796,830 600,878 404,830" fill="#ffe4e6" stroke="#be123c" stroke-width="1.6"/><text x="600" y="825.975" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helve