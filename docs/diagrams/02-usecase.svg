<rect x="330" y="66" width="560" height="742" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="610" y="92" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="16" fill="#334155" font-weight="700">ระบบ Auto Reconcile Bank</text><ellipse cx="610" cy="142" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="146.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-01 เข้าสู่ระบบ</text><ellipse cx="610" cy="202" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="206.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-02 นำเข้าไฟล์ Bank Statement</text><ellipse cx="610" cy="262" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="266.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-03 ซิงค์ข้อมูล GL</text><ellipse cx="610" cy="322" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="326.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-04 จับคู่รายการด้วยตนเอง</text><ellipse cx="610" cy="382" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="386.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-05 ให้ระบบเสนอคู่ที่ตรงกัน</text><ellipse cx="610" cy="442" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="446.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-06 พักรายการเข้าบัญชีพักโอน</text><ellipse cx="610" cy="502" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="506.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-07 ดึงรายการพักกลับมาจับคู่</text><ellipse cx="610" cy="562" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="566.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-08 ยกเลิกการจับคู่ (Unmatch)</text><ellipse cx="610" cy="622" rx="248" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="610" y="626.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">UC-09 จัดการข้อมูล Statement</text><ellipse cx="610" cy="692" rx="248" ry="25" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="610" y="696.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#14532d">UC-10 ดูรายงาน &amp; Export Excel</text><ellipse cx="610" cy="752" rx="248" ry="25" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/><text x="610" y="756.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#14532d">UC-11 ดูสรุปภาพรวมรายเดือน</text><g stroke="#15803d" stroke-width="2" fill="none"><circle cx="160" cy="274" r="11" fill="#dcfce7"/><line x1="160" y1="285" x2="160" y2="310"/><line x1="146" y1="294" x2="174" y2="294"/><line x1="160" y1="310" x2="148" y2="330"/><line x1="160" y1="310" x2="172" y2="330"/></g><text x="160" y="350" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="700">Accountant (Admin)</text><text x="160" y="367" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="400">ทำได้ทุกอย่างในระบบ</text><g stroke="#15803d" stroke-width="2" fill="none"><circle cx="160" cy="674" r="11" fill="#dcfce7"/><line x1="160" y1="685" x2="160" y2="710"/><line x1="146" y1="694" x2="174" y2="694"/><line x1="160" y1="710" x2="148" y2="730"/><line x1="160" y1="710" x2="172" y2="730"/></g><text x="160" y="750" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="700">ผู้ใช้งานทั่วไป (User)</text><text x="160" y="767" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="400">ดูรายงานและสรุปเท่านั้น</text><g stroke="#15803d" stroke-width="2" fill="none"><circle cx="1070" cy="274" r="11" fill="#dcfce7"/><line x1="1070" y1="285" x2="1070" y2="310"/><line x1="1056" y1="294" x2="1084" y2="294"/><line x1="1070" y1="310" x2="1058" y2="330"/><line x1="1070" y1="310" x2="1082" y2="330"/></g><text x="1070" y="350" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="700">TRW Data Center API</text><text x="1070" y="367" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" fill="#14532d" font-weight="400">ตรวจสอบผู้ใช้ + ซิงค์ GL</text><line x1="206" y1="300" x2="360" y2="142" stroke="#94a3b8" stroke-width="1.4" /><line x1="206