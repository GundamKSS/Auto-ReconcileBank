<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1200" viewBox="0 0 1260 1200">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1260" height="1200" fill="#ffffff"/>
<text x="630" y="32" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="19" fill="#0b1727" font-weight="700">ภาพที่ 4  Sequence Diagram — การจับคู่ด้วย Suggest matches</text>
<rect x="30" y="60" width="220" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="140" y="87.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">ผู้ใช้งาน (Admin)</text><line x1="140" y1="106" x2="140" y2="1112" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="310" y="60" width="220" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="420" y="87.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">หน้าจอ Reconcile</text><line x1="420" y1="106" x2="420" y2="1112" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="650" y="60" width="220" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="760" y="87.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">Next.js API</text><line x1="760" y1="106" x2="760" y2="1112" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="980" y="60" width="220" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="1090" y="87.725" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="13.5" font-weight="700" fill="#12325c">SQL Server</text><line x1="1090" y1="106" x2="1090" y2="1112" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="140" y1="142" x2="420" y2="142" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="184.9" y="122" width="190.2" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="280" y="134" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">1. กดปุ่ม "Suggest matches"</text><line x1="420" y1="186" x2="760" y2="186" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="485" y="166" width="210" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="178" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">2. POST /api/reconcile/suggest</text><line x1="760" y1="230" x2="1090" y2="230" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="783.7" y="210" width="282.59999999999997" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="222" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">3. SELECT BankStatementLine ที่ UNMATCHED</text><line x1="760" y1="274" x2="1090" y2="274" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="773.8" y="254" width="302.4" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="266" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">4. SELECT GL ที่ยังไม่ถูกจับคู่ (NOT EXISTS)</text><line x1="1090" y1="318" x2="760" y2="318" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="839.8" y="298" width="170.39999999999998" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="310" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">5. รายการค้างทั้ง 2 ฝั่ง</text><rect x="652" y="346" width="216" height="42" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="760" y="371.2" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#12325c">6. จับกลุ่ม 1:1 → 1:N → N:1</text><line x1="760" y1="422" x2="420" y2="422" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="461.9" y="402" width="256.2" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="414" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">7. clusters — ยังไม่บันทึกลงฐานข้อมูล</text><line x1="420" y1="466" x2="140" y2="466" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="175" y="446" width="210" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="280" y="458" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">8. แสดงหน้า Preview ให้ตรวจสอบ</text><line x1="140" y1="510" x2="420" y2="510" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="99.10000000000002" y="490" width="361.79999999999995" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="280" y="502" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">9. ติ๊กเอากลุ่มที่ไม่ต้องการออก แล้วกด "ยืนยัน Match"</text><line x1="420" y1="554" x2="760" y2="554" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="488.3" y="534" width="203.39999999999998" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="546" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">10. POST /api/reconcile/match</text><rect x="652" y="582" width="216" height="42" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="760" y="607.2" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12" font-weight="400" fill="#1e293b">11. ตรวจความถูกต้องของข้อมูลที่ส่งมา</text><line x1="760" y1="658" x2="1090" y2="658" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="849.7" y="638" width="150.6" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="650" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">12. BEGIN TRANSACTION</text><line x1="760" y1="702" x2="1090" y2="702" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="773.8" y="682" width="302.4" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="694" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">13. INSERT ReconciliationMatch → ได้ MatchId</text><line x1="760" y1="746" x2="1090" y2="746" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="737.5" y="726" width="375" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="738" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">14. INSERT ReconciliationMatchLine ทุกกลุ่ม (พร้อม Num)</text><line x1="760" y1="790" x2="1090" y2="790" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="740.8" y="770" width="368.4" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="782" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">15. UPDATE BankStatementLine → MatchStatus = 'MATCHED'</text><line x1="760" y1="834" x2="1090" y2="834" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="886" y="814" width="78" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="925" y="826" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">16. COMMIT</text><line x1="760" y1="878" x2="420" y2="878" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="409.1" y="858" width="361.79999999999995" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="870" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">17. { matchId, matchType, groupCount, bankLineCount }</text><line x1="420" y1="922" x2="760" y2="922" stroke="#475569" stroke-width="1.6"  marker-end="url(#ah)"/><rect x="438.8" y="902" width="302.4" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="914" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">18. GET /api/reconcile/data (โหลดข้อมูลใหม่)</text><line x1="760" y1="966" x2="420" y2="966" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="511.4" y="946" width="157.2" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="590" y="958" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">19. รายการค้างที่เหลือ</text><line x1="420" y1="1010" x2="140" y2="1010" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="112.30000000000001" y="990" width="335.4" height="17" rx="4" fill="#ffffff" opacity="0.96"/><text x="280" y="1002" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">20. แจ้ง "จับคู่สำเร็จ" และแสดงตารางที่อัปเดตแล้ว</text><rect x="700" y="1128" width="540" height="44" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.6"/><text x="970" y="1154.375" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="400" fill="#881337">หากขั้นตอนที่ 13–15 ล้มเหลว ระบบจะ ROLLBACK ทั้งหมด ไม่มีข้อมูลค้างครึ่งๆ กลางๆ</text><text x="350" y="1150" text-anchor="middle" style="font-family:'Thonburi','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif" font-size="12.5" fill="#475569" font-weight="400">ขั้นที่ 1–8 เป็นการดูตัวอย่างเท่านั้น ยังไม่เขียนฐานข้อมูล</text></svg>